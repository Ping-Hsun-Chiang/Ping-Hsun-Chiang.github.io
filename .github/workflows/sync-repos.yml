name: Sync GitHub Repos to Portfolio

on:
  schedule:
    - cron: '0 0 * * *'  # 08:00 CST (UTC+8)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run sync script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/sync_repos.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/tracked_repos.json
          git diff --cached --quiet || (git commit -m "auto: sync new GitHub repos" && git push)
